name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up JDK 25 (Gradle daemon)
        id: java25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make both JDKs available to Gradle
        run: |
          mkdir -p "$HOME/.gradle"
          printf '\norg.gradle.java.installations.paths=%s,%s\n' \
            '${{ steps.java21.outputs.path }}' \
            '${{ steps.java25.outputs.path }}' >> "$HOME/.gradle/gradle.properties"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Run unit tests (JUnit, Mockito, Robolectric)
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/test-results/

  espresso-tests:
    name: Espresso UI tests on emulator
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up JDK 25 (Gradle daemon)
        id: java25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make both JDKs available to Gradle
        run: |
          mkdir -p "$HOME/.gradle"
          printf '\norg.gradle.java.installations.paths=%s,%s\n' \
            '${{ steps.java21.outputs.path }}' \
            '${{ steps.java25.outputs.path }}' >> "$HOME/.gradle/gradle.properties"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM (lets the emulator run fast)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Espresso tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest

      - name: Upload Espresso test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espresso-test-report
          retention-days: 7
          path: app/build/reports/androidTests/